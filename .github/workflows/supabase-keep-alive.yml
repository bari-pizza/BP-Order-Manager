name: Supabase Keep Alive

on:
  schedule:
    # Daily 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
          - name: development
    steps:
      - name: Ping ${{ matrix.name }} Supabase
        env:
          # Prod: SUPABASE_URL_PROD + SUPABASE_ANON_KEY_PROD (+ optional SUPABASE_SERVICE_ROLE_KEY_PROD)
          SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          SUPABASE_SERVICE_ROLE_KEY_PROD: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
          # Dev: reuse existing CI/e2e secrets
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            URL="$SUPABASE_URL_PROD"
            ANON_KEY="$SUPABASE_ANON_KEY_PROD"
            DB_KEY="${SUPABASE_SERVICE_ROLE_KEY_PROD:-$ANON_KEY}"
          else
            URL="$VITE_SUPABASE_URL"
            ANON_KEY="$VITE_SUPABASE_ANON_KEY"
            DB_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$ANON_KEY}"
          fi

          if [ -z "$URL" ] || [ -z "$ANON_KEY" ]; then
            echo "Missing secrets for $TARGET (need URL + key)."
            exit 1
          fi

          echo "Pinging Auth service for $TARGET..."
          curl -fsS --retry 2 --retry-delay 5 \
            "${URL}/auth/v1/health" \
            -H "apikey: ${ANON_KEY}"
          echo

          echo "Querying database to reset $TARGET inactivity timer..."
          if ! curl -fsS --retry 2 --retry-delay 5 \
            "${URL}/rest/v1/OrderOrigin?select=origin_id&limit=1" \
            -H "apikey: ${DB_KEY}" \
            -H "Authorization: Bearer ${DB_KEY}"; then
            if [ "$TARGET" = "production" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY_PROD:-}" ]; then
              echo "::warning::Production table read failed (likely RLS). Add SUPABASE_SERVICE_ROLE_KEY_PROD to repo secrets to bypass RLS."
            else
              exit 1
            fi
          fi
          echo
          echo "ok: $TARGET"
